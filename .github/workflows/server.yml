# ============================================================
# Build & publish the gamut server image to GHCR (arm64).
#
# Trigger: a push to main that touches the server or the shared engine. The
# Raspberry Pi (via Komodo) polls GHCR and auto-pulls :latest, so a merge that
# changes server/** effectively deploys. Pushing client files (index.html,
# script.js, styles.css, net.js, config.js) does NOT run this — those deploy
# to GitHub Pages instead. See GAME-SERVER-PLATFORM.md Part E.2.
#
# GHCR namespaces are lowercase → ghcr.io/iamyvj/gamut-server.
# After the first successful run, mark that GHCR package PUBLIC once so the Pi
# can pull it without logging in.
# ============================================================
name: Build & publish gamut server image

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'engine.js'                    # shared engine — bundled via require('../engine.js')
      - '.github/workflows/server.yml' # rebuild when the pipeline itself changes
  workflow_dispatch: {}                # manual run (first deploy / re-trigger)

# A newer push supersedes an in-flight build for the same ref.
concurrency:
  group: gamut-server-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read     # actions/checkout
      packages: write    # push to GHCR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub runners are amd64; the Pi is arm64 → emulate arm64 via QEMU.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Ephemeral, auto-scoped token — no personal access token / stored secret.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          # Context is the REPO ROOT (not server/) so the image can COPY the
          # root-level engine.js that rooms.js/session.js require('../engine.js').
          context: .
          file: server/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/iamyvj/gamut-server:latest
            ghcr.io/iamyvj/gamut-server:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          # Single platform → skip the extra provenance/attestation manifest so
          # the Pi pulls a plain image (simplest for `docker pull`).
          provenance: false
          # Cache layers across runs — emulated arm64 npm installs are slow.
          cache-from: type=gha
          cache-to: type=gha,mode=max
